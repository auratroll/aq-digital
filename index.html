<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQ Digital - Portal v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        .glass { background: rgba(19, 25, 39, 0.7); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.06); }
        .input-dark { background: rgba(13, 18, 32, 0.9); border: 1px solid rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body class="text-white min-h-screen">

    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-2xl mx-auto mb-4 flex items-center justify-center text-3xl shadow-cyan-500/20 shadow-lg">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">AQ DIGITAL</h1>
                <p class="text-slate-400 text-sm mt-1">International Business Portal</p>
            </div>

            <button id="google-btn" class="w-full flex items-center justify-center gap-3 bg-white/5 hover:bg-white/10 text-white font-semibold py-3.5 rounded-xl border border-white/10 transition mb-6">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5">
                <span>Continue with Google</span>
            </button>

            <div class="relative flex items-center mb-6">
                <div class="flex-grow border-t border-white/5"></div>
                <span class="mx-4 text-[10px] text-slate-500 font-bold uppercase tracking-widest">Or Email Access</span>
                <div class="flex-grow border-t border-white/5"></div>
            </div>

            <form id="email-form" class="space-y-3">
                <input type="email" id="email-input" placeholder="Email Address" class="w-full input-dark rounded-xl px-4 py-3.5 text-sm outline-none focus:border-cyan-500 transition" required>
                <input type="password" id="password-input" placeholder="Password" class="w-full input-dark rounded-xl px-4 py-3.5 text-sm outline-none focus:border-cyan-500 transition" required>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold shadow-lg shadow-blue-500/20 transition">Login / Register</button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-cyan-500 rounded flex items-center justify-center text-white text-sm"><i class="fa-solid fa-code"></i></div>
                <span class="font-bold">AQ <span class="text-cyan-400">DIGITAL</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="user-name" class="text-xs font-bold"></p>
                    <button id="logout-btn" class="text-[10px] text-red-400 font-bold uppercase tracking-tighter hover:underline">Logout</button>
                </div>
                <img id="user-photo" src="" class="w-10 h-10 rounded-full border-2 border-cyan-500/30">
            </div>
        </header>

        <main class="max-w-5xl mx-auto p-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass rounded-3xl p-8">
                    <h2 class="text-xl font-bold mb-6">Create New <span class="text-cyan-400">Order</span></h2>
                    <form id="order-form" class="space-y-4">
                        <select id="pkg-input" class="w-full input-dark rounded-xl px-4 py-4 text-sm outline-none focus:border-cyan-500 transition" required>
                            <option value="" disabled selected>Select Package</option>
                            <option value="Silver">Silver (1-Page Portfolio)</option>
                            <option value="Golden">Golden (3-Pages Business)</option>
                            <option value="Diamond">Diamond (Full-Stack Web)</option>
                        </select>
                        <textarea id="desc-input" rows="4" placeholder="Tell us about your project requirements..." class="w-full input-dark rounded-xl p-4 text-sm outline-none focus:border-cyan-500 transition" required></textarea>
                        <input type="text" id="phone-input" placeholder="WhatsApp Number" class="w-full input-dark rounded-xl px-4 py-4 text-sm outline-none focus:border-cyan-500 transition" required>
                        <button type="submit" id="submit-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 py-4 rounded-xl font-extrabold text-slate-900 transition shadow-lg shadow-cyan-500/20">Submit Order</button>
                    </form>
                </div>

                <div>
                    <h2 class="text-xl font-bold mb-6">Order <span class="text-cyan-400">History</span></h2>
                    <div id="orders-list" class="space-y-4">
                        <div class="p-6 text-center text-slate-500 italic text-sm glass rounded-2xl">No orders found yet.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0rN_SB5L4TNnAKX0ful931iNt9fcRo-4",
            authDomain: "aq-digital-62c4e.firebaseapp.com",
            projectId: "aq-digital-62c4e",
            storageBucket: "aq-digital-62c4e.firebasestorage.app",
            messagingSenderId: "158917825602",
            appId: "1:158917825602:web:f7208a77b4774af89109db"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
                document.getElementById('user-photo').src = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=0ea5e9&color=fff`;
                fetchOrders(user.uid);
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('hidden');
            }
        });

        document.getElementById('google-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        document.getElementById('email-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                try { await createUserWithEmailAndPassword(auth, email, pass); } catch(e) { alert(e.message); }
            }
        };

        document.getElementById('order-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = "Processing...";
            try {
                await addDoc(collection(db, "orders"), {
                    userId: auth.currentUser.uid,
                    clientName: auth.currentUser.displayName || auth.currentUser.email,
                    package: document.getElementById('pkg-input').value,
                    description: document.getElementById('desc-input').value,
                    contact: document.getElementById('phone-input').value,
                    status: "Pending",
                    createdAt: new Date()
                });
                alert("Order Sent! AQ Digital will review it.");
                document.getElementById('order-form').reset();
            } catch (err) { alert(err.message); }
            btn.disabled = false; btn.textContent = "Submit Order";
        };

        function fetchOrders(uid) {
            const q = query(collection(db, "orders"), where("userId", "==", uid), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('orders-list');
                list.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    list.innerHTML += `
                        <div class="glass p-5 rounded-2xl flex justify-between items-center border-l-4 border-cyan-500">
                            <div>
                                <p class="text-cyan-400 font-bold text-sm">${data.package} Package</p>
                                <p class="text-[10px] text-slate-500 mt-1">${new Date(data.createdAt.seconds * 1000).toLocaleString()}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest ${data.status === 'Pending' ? 'bg-orange-500/10 text-orange-500' : 'bg-green-500/10 text-green-500'}">
                                ${data.status}
                            </span>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
