<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQ Digital - Client Portal & Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center p-4">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
        <div class="absolute -top-20 -left-20 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 w-full max-w-md bg-[#131927] border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-2xl mb-4 text-white text-3xl shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">AQ DIGITAL</h1>
            <p class="text-xs text-slate-400 tracking-widest uppercase mt-1">Client Portal Access</p>
        </div>

        <div id="login-view" class="space-y-4">
            <h2 class="text-xl font-bold text-center text-slate-200">Welcome Back</h2>
            <p class="text-sm text-slate-400 text-center mb-6">Sign in to track your web development orders.</p>

            <button id="google-btn" class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3.5 px-4 rounded-xl border border-slate-700 transition duration-300 shadow-md">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                <span>Continue with Google</span>
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase">Or Email</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <form id="email-form" class="space-y-3">
                <div>
                    <input type="email" id="email-input" placeholder="Your Email Address" required class="w-full bg-slate-900/80 border border-slate-800 focus:border-cyan-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none transition">
                </div>
                <div>
                    <input type="password" id="password-input" placeholder="Password" required class="w-full bg-slate-900/80 border border-slate-800 focus:border-cyan-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none transition">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-cyan-500/20 transition duration-300">
                    Sign In / Register
                </button>
            </form>
        </div>

        <div id="dashboard-view" class="hidden text-center space-y-6">
            <div class="relative inline-block">
                <img id="user-photo" src="" alt="Profile" class="w-20 h-20 rounded-full mx-auto border-2 border-cyan-400 p-1">
                <span class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h3 id="user-name" class="text-xl font-bold text-white"></h3>
                <p id="user-email" class="text-sm text-slate-400"></p>
            </div>

            <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 text-left">
                <p class="text-xs text-cyan-400 font-bold uppercase tracking-wider mb-1">Status</p>
                <p class="text-sm text-slate-300">✅ Authenticated successfully! Client Portal is ready for order placement.</p>
            </div>

            <button id="logout-btn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold py-3 px-4 rounded-xl border border-red-500/20 transition">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // AAPKI EXACT FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyA0rN_SB5L4TNnAKX0ful931iNt9fcRo-4",
            authDomain: "aq-digital-62c4e.firebaseapp.com",
            projectId: "aq-digital-62c4e",
            storageBucket: "aq-digital-62c4e.firebasestorage.app",
            messagingSenderId: "158917825602",
            appId: "1:158917825602:web:f7208a77b4774af89109db",
            measurementId: "G-6QD6LHMPHN"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const googleBtn = document.getElementById('google-btn');
        const emailForm = document.getElementById('email-form');
        const logoutBtn = document.getElementById('logout-btn');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const userPhoto = document.getElementById('user-photo');

        // 1. Google Sign In
        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Google Sign-In Error: " + error.message);
            }
        });

        // 2. Email Sign In / Register
        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        alert("Account created successfully!");
                    } catch (createErr) {
                        alert("Registration Error: " + createErr.message);
                    }
                } else {
                    alert("Auth Error: " + error.message);
                }
            }
        });

        // 3. Logout
        logoutBtn.addEventListener('click', () => signOut(auth));

        // 4. Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                
                userName.textContent = user.displayName || "Valued Client";
                userEmail.textContent = user.email;
                userPhoto.src = user.photoURL || "https://ui-avatars.com/api/?name=" + encodeURIComponent(user.email);
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
